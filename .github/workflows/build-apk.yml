name: Build APK

# يبني ملف APK (Release) تلقائيًا. لا يحتاج أي حساب أو أسرار (Secrets).
# شغّله يدويًا من تبويب Actions ▸ Build APK ▸ Run workflow، أو عند كل push إلى main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npx expo install --check || npx expo install --fix

      - name: Type-check and lint
        run: npm run check

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle.log

      - name: Show Gradle error summary
        if: failure()
        run: |
          msg=$(grep -E -A12 "What went wrong|FAILURE: Build failed|error:" gradle.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle failure::${msg}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qissa-screenwriter-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
