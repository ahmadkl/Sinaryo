name: Build APK

# يبني ملف APK (Release) تلقائيًا. لا يحتاج أي حساب أو أسرار (Secrets).
# شغّله يدويًا من تبويب Actions ▸ Build APK ▸ Run workflow، أو عند كل push إلى main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npx expo install --check || npx expo install --fix

      - name: Type-check and lint
        run: npm run check

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qissa-screenwriter-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
